# Источники для RSS + LLM Active Learning (kazmorph).
#
# Принципы отбора источников (см. ~/Downloads/text_check_idea.md, Фаза 0):
#   • Только государственные / официальные источники — для юридической
#     чистоты (законы и НПА вообще не охраняются авторским правом; пресс-
#     релизы госорганов используем только для извлечения лингвистических
#     признаков, не публикуем сырой текст).
#   • Казахоязычные версии (lang: kk) — пайплайн анализирует казахский.
#   • Сырой текст хранится максимум RAW_TEXT_RETENTION_DAYS (default 7),
#     затем автоматически удаляется; публикуется только CoNLL-U разметка.
#
# robots.txt для inform.kz: Allow: / — парсинг разрешён (кроме /search/
# и пагинации). Проверено 2026-08-04.
#
# Добавление новых источников:
#   1. Проверить robots.txt и наличие казахоязычной версии.
#   2. Если есть RSS — type: rss. Если нет — type: html + trafilatura.
#   3. Указать lang (kk/ru/both) и category (news/legal/press).
#   4. Прогнать вручную scripts/harvest_sources.py и убедиться, что текст
#      извлекается чисто (без навигации/рекламы).

sources:
  - name: inform_kz
    type: rss
    url: "https://kaz.inform.kz/rss/kz.xml"
    lang: kk
    category: news
    # Описание для админки/отчётов.
    description: "Казинформ — государственное информационное агентство РК, казахоязычная лента (200 последних новостей)."
    # Сколько статей брать за один прогон (лимит, чтобы не гонять всю ленту
    # каждый раз при ручном запуске; cron всё равно берёт свежие).
    max_articles: 30
    # inform.kz отдаёт ПОЛНЫЕ тексты в summary — порог 200 отбрасывает
    # только заголовки без тела. 
    min_text_length: 200

  - name: habar_24kz
    type: rss
    url: "https://24.kz/kz/rss-yandex"
    lang: kk
    category: news
    description: "24.kz (Хабар) — государственный телеканал, казахоязычная лента (~980 записей)."
    max_articles: 30
    # 24.kz отдаёт в RSS только КОРОТКИЕ анонсы (87-150 символов), полный
    # текст — на странице статьи. Порог 100 пропускает однострочные
    # заголовки, но берёт анонсы-абзацы. Для полного текста нужна отдельная
    # фича full-text-fetch (ходить по каждой ссылке + trafilatura) — TODO.
    min_text_length: 100

# Запланировано к добавлению (после стабилизации inform.kz + 24.kz):
#   - akorda_kz      — akorda.kz (Президент РК), press-релизы, kk
#   - primeminister  — primeminister.kz / gov.kz (Правительство), kk
#   - adilet_zan     — adilet.zan.kz (НПА — законы, public domain), legal
#   - baq_kz         — baq.kz (казахский по умолчанию, sitemap 27k URL, HTML)
#   - nur_kz         — nur.kz/kk/feed (CSV-формат, нужен спец-парсер)
#   - zakon_kz       — kaz.zakon.kz (казахская версия, sitemap)
# Для каждого нужен discovery: RSS/HTML, kk-версия, robots.txt.
#
# НЕ подходит (проверено 2026-08-04):
#   - tengrinews.kz  — НЕТ казахоязычной версии (только русский)
#   - liter.kz       — только русский, казахской версии нет
#   - astanatimes.kz — сайт скомпрометирован (301-редирект на посторонний домен)
#   - today.kz       — сервер мёртв (ECONNREFUSED)
