[pytest]
# Custom markers. `slow` covers tests that load KazBERT (~440 MB) and run at
# least one real training epoch — skip them with: pytest -m "not slow".
markers =
    slow: tests that load large models or run multi-epoch training (skip with -m "not slow")
testpaths = tests
# Silence the Pipeline() stub-mode warning in the test suite: many tests
# deliberately construct a stub Pipeline() to exercise the rule-based path,
# and the safeguard (added to surface accidental stub usage in demos/scripts)
# would otherwise spam ~60 warnings per run and hide real issues. The warning
# still fires in production code (demo.py, coverage_check.py, etc.).
filterwarnings =
    ignore:Pipeline\(\) loaded with NO trained models
